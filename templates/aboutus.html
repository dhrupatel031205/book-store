<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../static/main.css">
    <style>
        .navbar {
            background-color: #343a40 !important;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 0.5s ease-in-out forwards;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
            font-size: 18px;
        }

        .profile-card,
        .order-history {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease-in-out forwards;
        }

        .order-history h5 {
            border-bottom: 2px solid #28a745;
            padding-bottom: 5px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container p-4">
            <a class="navbar-brand" href="/home">
                <img src="{{ url_for('static', filename='images/logo.png') }}?v=1"
                    style="height: 120px; border-radius: 50%;" alt="" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="#navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="/home" class="nav-link p-3">Home</a></li>
                    <li class="nav-item"><a href="/store" class="nav-link p-3">Store</a></li>
                    <li class="nav-item"><a href="/contactus" class="nav-link p-3">Contact Us</a></li>
                    <li class="nav-item"><a href="/profile" class="nav-link p-3 active bg-success rounded">Profile</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="/cart" class="nav-link p-3">Cart</a></li>
                    <li class="nav-item"><a href="/logout" class="nav-link p-3">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h4>User Details:</h4>
                <button class="btn btn-outline-primary p-3" data-bs-toggle="modal"
                    data-bs-target="#editProfileModal">Edit User Details</button>
            </div>
            {% for user in userdata %}
            <p><strong>Username:</strong> {{ user[1] }}</p>
            <p><strong>Name:</strong> {{ user[3] }}</p>
            <p><strong>Email:</strong> {{ user[4] }}</p>
            <p><strong>Address:</strong> {{ user[5] }}</p>
            {% endfor %}
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="/update_profile" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" name="name" value="{{ userdata[0][3] }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ userdata[0][4] }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address" value="{{ userdata[0][5] }}">
                        </div>
                        <button type="submit" class="btn btn-success">Save Changes</button>
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
