<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease-in-out forwards;
            width: 350px;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .logo {
            display: block;
            margin: 0 auto 15px;
            width: 80px;
            border-radius: 20px;
            animation: spinIn 1s ease-in-out;
        }
        @keyframes spinIn {
            from {
                transform: rotateY(180deg);
                opacity: 0;
            }
            to {
                transform: rotateY(0);
                opacity: 1;
            }
        }
        .form-control {
            width: 80%;
            margin: 0 auto;
            font-size: 0.9rem;
            padding: 5px;
            transition: transform 0.3s ease-in-out;
        }
        .form-control:focus {
            transform: scale(1.05);
        }
        button {
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="container text-center bg-info">
        <img src="{{ url_for('static', filename='images/logo.png') }}?v=1" class="logo" alt="Logo">
        <div class="h4 mb-3">Sign Up</div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('signup.signup') }}" method="POST">
            <input type="text" name="name" class="form-control inputs mb-2" placeholder="Name" pattern="^[A-Za-z ]{3,50}$" required>
            <input type="email" name="email" class="form-control inputs mb-2" placeholder="Email" required>
            <input type="text" name="username" class="form-control inputs mb-2" placeholder="Username" pattern="^[a-zA-Z0-9_]{5,20}$" required>
            <input type="password" name="password" class="form-control inputs mb-2" placeholder="Password" pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$" required>
            <textarea class="form-control inputs mb-2" id="address" name="address" rows="2" required placeholder="Address"></textarea>
            <button type="submit" class="btn btn-success mt-2">Sign Up</button>
        </form>
        <p class="mt-3">
            Already have an account? <a href="{{ url_for('login.login') }}">Log In</a>
        </p>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
