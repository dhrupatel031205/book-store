<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
    <style>
        body {
            background-color: #b0d7ff;
        }

        .navbar {
            background-color: #343a40 !important;
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .card {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            border: none;
            overflow: hidden;
            border-radius: 10px;
            width: 200px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card-img-top {
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .card-body {
            text-align: center;
        }

        .btn-success {
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/home">BookStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="/home" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/store" class="nav-link active bg-success rounded">Store</a></li>
                    <li class="nav-item"><a href="/contactus" class="nav-link">Contact Us</a></li>
                    <li class="nav-item"><a href="/profile" class="nav-link">Profile</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="/cart" class="nav-link ">Cart</a></li>
                    <li class="nav-item"><a href="/logout" class="nav-link ">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            {% for book in booksData %}
            <div class="col-md-3 col-lg-2 col-sm-4 mb-4 d-flex justify-content-center">
                <div class="card h-100">
                    <img src="{{ book[5] }}" class="card-img-top" alt="Book Image">
                    <div class="card-body">
                        <h6 class="card-title">{{ book[1] }}</h6>
                        <p class="card-text text-muted">Author: {{ book[2] }}</p>
                        <p class="card-text fw-bold">Price: Rs. {{ book[3] }}</p>
                        <select class="form-select mb-2 book-quantity">
                            <option selected>Quantity</option>
                            {% for i in range(book[6]) %}
                            <option value="{{ i+1 }}">{{ i+1 }}</option>
                            {% endfor %}
                        </select>
                        <button class="btn btn-success addToCart" 
                                data-book='{"id": "{{ book[0] }}", "name": "{{ book[1] }}", "author": "{{ book[2] }}", "price": "{{ book[3] }}"}'>
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <script src="../static/js/store.js"></script>
</body>
</html>
