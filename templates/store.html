<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../static/main.css">

    <style>
        body {
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
        }

        .nav-link{
            font-size: 18px !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .navbar {
            background-color: #343a40 !important;
            transform: translateY(-100%);
            animation: slideDown 0.6s ease-out forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .card {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            border: none;
            overflow: hidden;
            border-radius: 10px;
            width: 200px;
            opacity: 0;
            transform: scale(0.9);
            animation: fadeUp 0.6s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .card-img-top {
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .btn-success {
            width: 100%;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn-success:hover {
            background-color: #28a745;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 128, 0, 0.3);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container p-4">
            <a class="navbar-brand" href="/home"><img src="{{ url_for('static', filename='images/logo.png') }}?v=1"
                    style="height: 120px; border-radius: 50%; " alt="" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="/home" class="nav-link p-3">Home</a></li>
                    <li class="nav-item"><a href="/store" class="nav-link p-3 active bg-success rounded">Store</a></li>
                    <li class="nav-item"><a href="/contactus" class="nav-link p-3">Contact Us</a></li>
                    <li class="nav-item"><a href="/profile" class="nav-link p-3">Profile</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="/cart" class="nav-link p-3">Cart</a></li>
                    <li class="nav-item"><a href="/logout" class="nav-link p-3">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            {% for book in booksData %}
            <div class="col-md-3 col-lg-2 col-sm-4 mb-4 d-flex justify-content-center">
                <div class="card h-100 bg-light m-2">
                    <img src="{{ book[5] }}" class="card-img-top" alt="Book Image">
                    <div class="card-body">
                        <h6 class="card-title">{{ book[1] }}</h6>
                        <p class="card-text text-muted">Author: {{ book[2] }}</p>
                        <p class="card-text fw-bold">Price: Rs. {{ book[3] }}</p>
                        <select class="form-select mb-2 book-quantity">
                            <option selected>Quantity</option>
                            {% for i in range(book[6]) %}
                            <option value="{{ i+1 }}">{{ i+1 }}</option>
                            {% endfor %}
                        </select>
                        <button class="btn btn-success addToCart"
                            data-book='{"id": "{{ book[0] }}", "name": "{{ book[1] }}", "author": "{{ book[2] }}", "price": "{{ book[3] }}"}'>
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
