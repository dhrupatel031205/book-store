<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
  </script>
  <style>
    body {
      background-color: #f8f9fa;
    }

    .navbar {
      background-color: #343a40 !important;
    }

    .navbar-brand,
    .nav-link {
      color: white !important;
    }

    .nav-link.active,
    .nav-link.bg-success {
      background-color: #28a745 !important;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/home">BookStore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a href="/home" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="/store" class="nav-link">Store</a></li>
          <li class="nav-item"><a href="/contactus" class="nav-link">Contact Us</a></li>
          <li class="nav-item"><a href="/profile" class="nav-link">Profile</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><a href="/cart" class="nav-link active bg-success">Cart</a></li>
          <li class="nav-item"><a href="/logout" class="nav-link">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Cart Items -->
  <div class="container mt-4">
    {% for book in cartData %}
    <div class="card mb-3" style="max-width: 540px;">
      <div class="row g-0">
        <div class="col-md-4">
          <img src="{{ book[5] }}" class="img-fluid rounded-start" alt="{{ book[1] }}">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title">{{ book[1] }}</h5>
            <p class="card-text">Author: {{ book[2] }}</p>
            <p class="card-text">Price: ${{ book[3] }}</p>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Checkout Button -->
  <div class="container text-center mt-4">
    <a href="/checkout" class="btn btn-primary btn-lg">Checkout</a>
  </div>
</body>

</html>
