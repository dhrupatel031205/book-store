<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .table th, .table td {
            text-align: center;
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h2 class="text-center">Your Bill</h2>

        <table class="table table-bordered mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Book</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                {% for book in cartData %}
                <tr>
                    <td>{{ book[1] }}</td>
                    <td>{{ book[2] }}</td>
                    <td>Rs. {{ book[3] }}</td>
                    <td>{{ book[6] }}</td>  <!-- Quantity -->
                    <td>Rs. {{ book[3] * book[6] }}</td>  <!-- Price * Quantity -->
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <h4 class="text-end mt-3 total-amount">Grand Total: <span class="text-success">Rs. {{ total }}</span></h4>

        <div class="text-center mt-4">
            <a href="/store" class="btn btn-success">Continue Shopping</a>
            <a href="/payment" class="btn btn-primary">Proceed to Payment</a>
        </div>
    </div>
</body>

</html>
