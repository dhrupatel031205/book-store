<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../static/main.css">

    <style>
        .navbar {
            background-color: #343a40 !important;
        }

        .navbar-brand, .nav-link {
            font-size: 18px;
            color: white !important;
        }

        .contact-container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: auto;
            margin-top: 50px;
        }

        .form-control {
            border-radius: 5px;
        }

        .btn-success {
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>

<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container p-4">
            <a class="navbar-brand" href="/home"><img src="{{ url_for('static', filename='images/logo.png') }}?v=1"
                    style="height: 120px; border-radius: 50%; " alt="" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="/home" class="nav-link p-3 ">Home</a></li>
                    <li class="nav-item"><a href="/store" class="nav-link p-3 ">Store</a></li>
                    <li class="nav-item"><a href="/contactus" class="nav-link p-3  active bg-success rounded">Contact Us</a></li>
                    <li class="nav-item"><a href="/profile" class="nav-link p-3">Profile</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="/cart" class="nav-link p-3">Cart</a></li>
                    <li class="nav-item"><a href="/logout" class="nav-link p-3 ">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="contact-container">
            <h3 class="text-center mb-4">Contact Us</h3>
            <form id="contactForm">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Enter your name" name="name" required>
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Enter your email" name="email" required>
                </div>
                <div class="mb-3">
                    <textarea class="form-control" rows="5" placeholder="Enter your message, question or any query" name="message" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Submit</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap Modal -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Thank You!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    We will contact you soon!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent actual form submission
            var successModal = new bootstrap.Modal(document.getElementById("successModal"));
            successModal.show(); // Show the modal
            this.reset(); // Reset form fields after submission
        });
    </script>

</body>

</html>
