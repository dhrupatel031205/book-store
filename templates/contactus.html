<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">

    <style>
        body {
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
        }

        .nav-link {
            color: white !important;
            font-size: 18px !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .navbar {
            background-color: #343a40 !important;
            transform: translateY(-100%);
            animation: slideDown 0.6s ease-out forwards;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .contact-container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: auto;
            margin-top: 50px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s ease-out forwards 0.5s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-control {
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }

        .form-control:focus {
            box-shadow: 0 0 10px rgba(0, 128, 0, 0.3);
        }

        .btn-success {
            width: 100%;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn-success:hover {
            background-color: #28a745;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 128, 0, 0.3);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container p-4">
            <a class="navbar-brand" href="/home">
                <img src="{{ url_for('static', filename='images/logo.png') }}?v=1" style="height: 120px; border-radius: 50%;" alt="Logo" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="/home" class="nav-link p-3">Home</a></li>
                    <li class="nav-item"><a href="/store" class="nav-link p-3">Store</a></li>
                    <li class="nav-item"><a href="/contactus" class="nav-link p-3 active bg-success rounded">Contact Us</a></li>
                    <li class="nav-item"><a href="/profile" class="nav-link p-3">Profile</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="/cart" class="nav-link p-3">Cart</a></li>
                    <li class="nav-item"><a href="/logout" class="nav-link p-3">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="contact-container">
            <h3 class="text-center mb-4">Contact Us</h3>

            <!-- Display Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form id="contactForm" action="{{ url_for('contactus.contactus') }}" method="POST">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Enter your name" name="name" required>
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Enter your email" name="email" required>
                </div>
                <div class="mb-3">
                    <textarea class="form-control" rows="5" placeholder="Enter your message, question, or any query" name="message" required></textarea>
                </div>
                <button type="submit" class="btn btn-success">Submit</button>
            </form>
        </div>
    </div>



    
</body>

</html>
